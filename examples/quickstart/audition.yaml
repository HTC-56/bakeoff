version: 1
candidates:
  - name: stub
    base_url: http://localhost:8000
    model: stub-model
    profile:
      system: "Answer with the bare value."
      temperature: 0.0
      max_tokens: 64
suites:
  - name: smoke
    path: suites/smoke
bar:
  defaults:
    min_pass_rate: 0.8
    max_p95_latency_ms: 2000
    max_tokens_per_case: 200
  overrides:
    - suite: smoke
      candidate: stub
      min_pass_rate: 1.0
